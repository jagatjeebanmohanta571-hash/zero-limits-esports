<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ZERO LIMITS Esports</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#080808;
  color:white;
  font-family:Arial,sans-serif;
}

header{
  padding:20px;
  text-align:center;
  border-bottom:1px solid #333;
}

.logo{
  font-size:28px;
  font-weight:900;
  color:#ffd400;
}

.hero{
  text-align:center;
  padding:45px 20px 30px;
}

.hero h1{
  font-size:42px;
  font-weight:900;
}

.hero p{
  margin-top:10px;
  color:#aaa;
}

.btn{
  display:inline-block;
  margin-top:25px;
  padding:15px 25px;
  background:#ffd400;
  color:#000;
  text-decoration:none;
  font-weight:bold;
  border-radius:8px;
}

.section{
  max-width:900px;
  margin:auto;
  padding:25px 15px 50px;
}

.banner{
  width:100%;
  border-radius:15px;
  margin-bottom:25px;
}

.title{
  text-align:center;
  color:#ffd400;
  font-size:30px;
  margin-bottom:20px;
}

.match{
  background:#151515;
  border:1px solid #333;
  border-radius:15px;
  padding:25px;
  text-align:center;
}

.match h3{
  font-size:28px;
  color:#ffd400;
  margin-bottom:15px;
}

.match p{
  color:#ddd;
  margin:8px 0;
}

footer{
  text-align:center;
  padding:25px;
  color:#777;
  border-top:1px solid #222;
}
</style>
</head>

<body>

<header>
  <div class="logo">ZERO LIMITS ESPORTS</div>
</header>

<section class="hero">
  <h1>FREE FIRE</h1>
  <p>BATTLE ROYALE LEAGUE</p>

  <a class="btn"
     href="https://forms.gle/3jEHNCzgZAv9nrVUA">
     REGISTER YOUR SQUAD
  </a>
</section>

<section class="section">

  <img src="match-banner.png"
       alt="ZERO LIMITS Match Schedule"
       class="banner">

  <h2 class="title">MATCH SCHEDULE</h2>

  <div class="match">
    <h3>MATCH 1</h3>

    <p><strong>Game:</strong> Free Fire</p>
    <p><strong>Date:</strong> Coming Soon</p>
    <p><strong>Time:</strong> Coming Soon</p>
    <p><strong>Room ID:</strong> Will be shared</p>
  </div>

</section>

<footer>
  © 2026 ZERO LIMITS Esports
</footer>

</body>
</html>
